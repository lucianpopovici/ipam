# Declarative computed fields — evaluated read-time, never stored.
#
# Three resolve entry types
# ─────────────────────────
# 1. Entity lookup
#      <var>:
#        field: <id_field_on_entity>   # entity[field] is the lookup key
#        entity: <redis_prefix>        # key = "{prefix}:{id}"
#        fallback: <default>           # used when lookup misses (default: "")
#
# 2. Chained lookup  (from_var must be declared before this entry)
#      <var>:
#        from_var: <prev_var>          # use a previously resolved dict as source
#        field: <id_field_on_source>   # source[field] is the lookup key
#        entity: <redis_prefix>
#        fallback: <default>
#
# 3. Peer-index  (1-based position among same-type peers in same scope)
#      <var>:
#        computed: peer_index
#        index_set: "project:{project_id}:ne_instances"  # {field} interpolated
#        peer_prefix: ne_inst          # key = "{prefix}:{id}"
#        group_by: ne_type_id          # peers must share this field value
#        sort_by: name                 # stable ordering
#
# Custom Jinja2 filters: pad(n), slugify
#
# M:N path note (CLAUDE_schema_flexibility.md):
#   When a resolve path traverses a many-to-many relation (e.g. pod ↔ site),
#   only one end is reachable via a chained lookup (picks one result from the
#   relation set). For true fan-out, use the relation store directly in
#   application code before calling evaluate().
#
# Site context note:
#   The spec hostname "{{ site.name|lower }}-{{ ne.kind|lower }}-{{ index|pad(2) }}"
#   requires ne_instance.pod_id to resolve site via the ne_in_pod relation.
#   When an NE instance is assigned to a POD (relate('ne_in_pod', nid, pod_id)),
#   the chained lookup below activates automatically.

ne_instance:
  hostname:
    description: >
      Derived hostname matching the spec pattern: ne-kind + peer-index.
      When ne_instance.pod_id is set (via ne_in_pod relation), the template
      can be extended to {{ site.name|lower }}-{{ ne.kind|lower }}-{{ index|pad(2) }}.
      Example without site: pnf-03.
    template: "{{ ne.kind | lower }}-{{ index | pad(2) }}"
    resolve:
      ne:                          # resolves ne_type dict as 'ne' (matches spec variable name)
        field: ne_type_id
        entity: ne_type
        fallback: {kind: unknown}
      index:                       # 1-based position among peers of same NE type in project
        computed: peer_index
        index_set: "project:{project_id}:ne_instances"
        peer_prefix: ne_inst
        group_by: ne_type_id
        sort_by: name

  display_label:
    description: >
      Short display label combining kind badge and name.
      Example: [PNF] pe-lon-01
    template: "[{{ ne.kind }}] {{ name }}"
    resolve:
      ne:
        field: ne_type_id
        entity: ne_type
        fallback: {kind: "?"}
